<!DOCTYPE html>

<html>

  <head>
    <title>Homepage</title>

    <!-- CUSTOM CSS -->
    <style>
      #map-container svg { width: 100%; height: auto; }
      #map-container path[data-name] { cursor: pointer; }
      #start-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>

  </head>

    <body>

      <h2>Logout</h2>
      <form action="/logout" method="POST">
          <input type="submit" value="Logout">
      </form>

      <div id="map-container"></div>

      <p id="state-label">Select a state</p>

      {% if state %}
        <div id = "state-stats">
          <p> {{ state }} </p>
          <p>Population: {{ population }}</p>
          <p>Population Density: {{ population_density }} /mi^2</p>
          <p>Vulnerability Index: {{ vulnerability_index }}</p>
          <p>Stringency Index: {{ stringency_index }} ({{ stringency_date }})</p>
        </div>
      {% endif %}

      <form action="/state_stats" method="POST" id="state-select-form">
        <input type="hidden" name="state_name" id="state-name-input"/>
      </form>

      <form action="/game" method="POST">
        <input type="hidden" name="state_name" id="game-state-name-input" value="{{ state }}"/>
        <button type="submit" id="start-btn" disabled>Start Simulation</button>
      </form>

      <!-- TAILWIND -->
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

      <!-- CUSTOM JS -->
      <script type="module">
        fetch('/static/us.svg')
          .then(r => r.text())
          .then(svgText => {
            document.getElementById('map-container').innerHTML = svgText;

            let selected = null;

            document.querySelectorAll('#map-container path[data-name]').forEach(path => {
              path._origFill = path.style.fill;
              path.addEventListener('mouseenter', () => {
                if (path !== selected) path.style.fill = '#aaa';
              });
              path.addEventListener('mouseleave', () => {
                if (path !== selected) path.style.fill = path._origFill;
              });
              path.addEventListener('click', () => {
                if (selected) selected.style.fill = selected._origFill;
                selected = path;
                path.style.fill = 'pink';

                const stateName = path.getAttribute('data-name');
                document.getElementById('state-name-input').value = stateName;
                document.getElementById('game-state-name-input').value = stateName;
                document.getElementById('start-btn').disabled = false;
                document.getElementById("state-select-form").submit();
              });
            });

            const alreadySelected = "{{ state }}";
            if (alreadySelected) {
              document.querySelectorAll('#map-container path[data-name]').forEach(path => {
                if (path.getAttribute('data-name') === alreadySelected) {
                  path.style.fill = 'pink';
                  selected = path;
                }
              });
            }
          });
      </script>

    </body>

</html>
