<!DOCTYPE html>

<html>
  
  <head>
    <title>mangodb's Pandemic Simulator</title>
    <!-- TAILWIND -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    

    <!-- CUSTOM CSS -->
    <style>
      #map-container path[data-name] { cursor: pointer; transition: fill 0.15s; }

      .bg {
        background-image: url("/static/images/bg.jpg");
        background-size: cover;
        background-position: center;
        filter: brightness(25%);
      }

      

    </style>
  </head>

    <body>
      <div class="bg fixed inset-0 -z-10"></div>

      <!-- main content -->
      <div class="flex flex-wrap gap-5 px-6 pb-8 max-w-6x1 mx-auto w-full items-start">
        
        <!-- map -->
        <div class="flex-1 basis-[580px] bg-black/45 border border-white/[0.08] rounded-2x1 p-5 mx-4 backdrop-blur-md">
          <div class="text-[0.68rem] font-semibold tracking-[0.12em] uppercase text-gray-500 mb-3">Click a State</div>
          <div id="map-container" class="w-full"></div>
        </div>

      <form action="/logout" method="POST">
          <input type="submit" value="Logout" class="text-white">
      </form>


      <p id="state-label" class="text-white">Select a state</p>

      {% if state %}
        <div id = "state-stats" class="text-white">
          <p> {{ state }} </p>
          <p>Population: {{ population }}</p>
          <p>Population Density: {{ population_density }} /mi^2</p>
          <p>Vulnerability Index: {{ vulnerability_index }}</p>
          <p>Stringency Index: {{ stringency_index }} ({{ stringency_date }})</p>
        </div>
      {% endif %}

      <form action="/state_stats" method="POST" id="state-select-form">
        <input type="hidden" name="state_name" id="state-name-input"/>
      </form>

      <form action="/game" method="POST">
        <input type="hidden" name="state_name" id="game-state-name-input" value="{{ state }}"/>
        <button type="submit" id="start-btn" disabled>Start Simulation</button>
      </form>


      <!-- CUSTOM JS -->
      <script type="module">
        fetch('/static/us.svg')
          .then(r => r.text())
          .then(svgText => {
            document.getElementById('map-container').innerHTML = svgText;

            let selected = null;

            document.querySelectorAll('#map-container path[data-name]').forEach(path => {
              path._origFill = path.style.fill;
              path.addEventListener('mouseenter', () => {
                if (path !== selected) path.style.fill = '#aaa';
              });
              path.addEventListener('mouseleave', () => {
                if (path !== selected) path.style.fill = path._origFill;
              });
              path.addEventListener('click', () => {
                if (selected) selected.style.fill = selected._origFill;
                selected = path;
                path.style.fill = 'pink';

                const stateName = path.getAttribute('data-name');
                document.getElementById('state-name-input').value = stateName;
                document.getElementById('game-state-name-input').value = stateName;
                document.getElementById('start-btn').disabled = false;
                document.getElementById("state-select-form").submit();
              });
            });

            const alreadySelected = "{{ state }}";
            if (alreadySelected) {
              document.querySelectorAll('#map-container path[data-name]').forEach(path => {
                if (path.getAttribute('data-name') === alreadySelected) {
                  path.style.fill = 'pink';
                  selected = path;
                }
              });
            }
          });
      </script>

    </body>

</html>
