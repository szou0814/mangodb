<!DOCTYPE html>


<html>

  <head>

    <title>Register</title>

    <!-- CUSTOM CSS -->
    <style>
      /* BACKGROUND */
      .bg {
        background-image: url("/static/images/bg.jpg");
        background-repeat: no-repeat;
        background-size: cover;

        width: 100vw;
        height: 100vh;

        filter: brightness(40%);

        position: fixed;
        top: 0;
        left: 0;
        z-index: -1;
      }

      body {
        color: white;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        overflow: hidden;
      }

      /* ICON */
      .icon {
        height: 30vh;
        margin-top: clamp(40px, 5%, 5%);

        display: flex;
        align-items: center;
        justify-content: center;
      }

      .glow {
        border-radius: 20%;
        box-shadow: rgba(100, 100, 100, 0.8) 0 0 90px 33px;
      }

      /* HEADER */
      #header {
        color: #1b0000;
        text-shadow: 0 0 12px #800000, -1px -2px white;

        font-size: 400%;
        font-weight: bolder;

        opacity: 0;
      }

      /* FORM */
      input:is([type="text"], [type="password"]) {
        border-width: 1px;
        border-radius: 5px;
        border-color: white;

        background-color: rgba(255,255,255, 0.1);

        padding: 5px;

        font-size: 105%;
      }

      input[type="submit"] {
        border-width: 1px;
        border-color: white;

        width: 5rem;
        margin-top: 10px;

        align-self: center;

        transform: scale(115%);
      }

      input[type="submit"]:hover {
        transform: scale(125%);
      }

      form {
        width: clamp(100px, 50%, 350px);;

        display: flex;
        flex-direction: column;

        transform: scale(110%)
      }

      a:hover {
        cursor: pointer;
      }

      .move {
        visibility: hidden;
      }

    </style>

  </head>

  <body>

    <div class='bg'> </div>
    <div class='icon'>
      <img class="glow" src="/static/images/icon.png" style="height: 100%;
                                                              width: auto;"> </img>
    </div>

    <h2 style="margin-top: 2.5vh" id="header"> Register </h2>

    <p class='move' style="color: #ff3333; margin-top: 10px;">
      {% if error != "" %}
        {{ error + "<p>&nbsp</p><p>&nbsp</p>" | safe }}
      {% else %}
        <p>&nbsp</p>
      {% endif %}
    </p>

    <form class='move' method="POST">
      <input type="text" name="user_id" placeholder="Username" required> <p>&nbsp</p>
      <input type="password" name="password" placeholder="Password" required> <p>&nbsp</p>
      <input type="submit" name="sub1" value="ENTER">
    </form>

    <p class='move'>&nbsp</p><p class='move'>&nbsp</p>

    <p class='move'> If you already have an account, please login <a style="color: #3333ff; text-decoration: underline" onclick="transition()">here</a> </p>

    <!-- TAILWIND -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <script>
      window.onload = () => {
        let items = Array.from(document.getElementsByClassName('move'));

        let shift = items.forEach(i => {
          i.style.visibility = 'visible';

          i.animate(
            [{transform: 'translate(-2000px, 0px)'}, {transform: 'translate(0px,  0px)'}],
            {
              duration: 1000,
              iterations: 1,
              easing: 'linear',
              fill: 'forwards',
            },
          )
        });

        let fade = document.getElementById('header').animate(
          [{opacity: '0'}, {opacity: '1'}],
          {
            duration: 1000,
            iterations: 1,
            easing: 'linear',
            fill: 'forwards',
          },
        );

        shift.play();
        fade.play();
      }

      function transition() {
        setTimeout(() => { window.location.href = "/"; }, 900);

        let items = Array.from(document.getElementsByClassName('move'));

        let shift = items.forEach(i => {
          i.animate(
            [{transform: 'translate(0, 0)'}, {transform: 'translate(2000px,  0px)'}],
            {
              duration: 900,
              iterations: 1,
              easing: 'linear',
              fill: 'forwards',
            },
          )
        });

        let fade = document.getElementById('header').animate(
          [{opacity: '1'}, {opacity: '0'}],
          {
            duration: 400,
            iterations: 1,
            easing: 'linear',
            fill: 'forwards',
          },
        );

        shift.play();
        fade.play();
      }
    </script>
  </body>

</html>
