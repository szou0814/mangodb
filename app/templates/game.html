<!DOCTYPE html>

<html>

  <head>

    <title>Simulator</title>
    <!-- TAILWIND -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>mangodb Pandemic Simulator</title>

    <!-- CUSTOM CSS -->
    <style>
      .bg {
        background-image: url("/static/images/bg.jpg");
        background-size: cover;
        background-position: center;
        filter: brightness(25%);
      }

      #but1 {
        background-color: rgba(180,0,0,0.6);
        padding: 4px;
        border-width: 1px;
        margin-left: 20px;
        font-size: 150%;
      }

      input[type="range"]::-webkit-slider-thumb {
        background: white;
      }

      #mainCont {
        height: 100%;
        width: 100%;

        display: flex;
        flex-direction: column;
      }

      #graphs {
        width: 100%;

        display: flex;
        flex-flow: row wrap;
        gap: 1%;

        align-items: center;
        justify-content: center;
        padding: 2% 1% 0 1%;

      }

      #map {
        width: clamp(700px, 50%, 50%);
        padding: 2% 0 2% 0;

        display: flex;
        align-items: center;
        justify-content: center;
      }

      #stackedLine {
        width: clamp(700px, 43%, 43%);
        padding: 2% 0 2% 0;

        display: flex;
        align-items: center;
        justify-content: center;
      }

    </style>

  </head>

  <body class="min-h-screen text-gray-200" style="font-family: 'Segoe UI', system-ui, sans-serif;">
    <!-- background -->
    <div class="bg fixed inset-0 -z-10"></div>

    <!-- nav -->
    <nav class="flex items-center justify-between px-8 py-3.5 bg-black/55 backdrop-blur-md border-b border-white/[0.07]">
      <div class="flex items-center gap-3">
        <img src="/static/images/icon.png" alt="icon" class="h-9 w-auto rounded-lg icon-glow">
        <span class="text-lg font-bold tracking-wide text-white glow">mongodb Pandemic Simulator</span>
      </div>
      <form action="/logout" method="POST">
        <button type="submit"
          class="bg-white/[0.06] border border-white/20 text-gray-400 hover:bg-white/[0.14] hover:text-white
                 px-5 py-1.5 rounded-md text-sm tracking-wider transition-colors cursor-pointer">
          Sign Out
        </button>
      </form>
    </nav>

    <div class="flex justify-between items-center px-4 py-2 border-b bg-red-900 mb-4">
      <div class="flex gap-6 text-sm">
        <span>State: <strong></strong></span>
        <span>Total Infected: <strong></strong></span>
        <span>Total Dead: <strong></strong></span>
        <span>Stringency Index: <strong></strong></span>
        <span>Social Vulnerability Index: <strong></strong></span>
      </div>
      <div class="text-sm">
        Date: <strong></strong>
      </div>
    </div>

    <div id="mainCont">
      <!-- UTIL -->
      <div id="util">
        <button id="but1" onclick="updateGraph()">Test Update Graph</button>
      </div>

      <!-- GRAPHS -->
      <div id="graphs">

         <div id="map"></div>

         <div id="stackedLine"></div>

      </div>
    </div>

    <!-- D3.JS IMPLEMENTATION -->
    <script type="module">
      import { map, data } from "/static/js/map.js";
      import { stackedLine } from "/static/js/stackedLine.js";
      import { Scrubber } from "/static/js/mbostockScrubber.js";
      import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

      document.getElementById('map').innerHTML = "<br>waiting for graph.....";
      document.getElementById('stackedLine').innerHTML = "<br>waiting for graph.....";

      async function generateMap() {
        window.mapElem = await map(); // everything below await will not run until this promise is complete

        document.getElementById('map').innerHTML = "";
        document.getElementById('map').append(mapElem);
      }

        async function generateStackedLine(date) {
        window.stackedLineElem = await stackedLine(date);

        document.getElementById('stackedLine').innerHTML = "";
        document.getElementById('stackedLine').append(stackedLineElem);
      }

      generateMap();

      var dates = [];
      data.forEach(point => {
        dates.push(point.date)
      })

      function updateStackedLine(date) {
        generateStackedLine(date);
      }

      const graphScrubber = Scrubber(dates, {delay: 80});
      document.getElementById('util').append(graphScrubber);

      graphScrubber.addEventListener("input", function() {
        mapElem.update(graphScrubber.value);
        updateStackedLine(graphScrubber.value);
      })
    </script>

    <!-- GLOBAL SCOPE FUNCTIONS (because it wouldn't let me import outside a module) -->
    <script>
      function updateGraph() {
        mapElem.update(new Date("1965-08-01"));
      }
    </script>

  </body>

</html>
