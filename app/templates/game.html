  <!-- D3.JS IMPLEMENTATION -->
  <script type="module">
    var pops = {{ pops | tojson }};
    var state_dots = {};
    var state_death_dots = {};
    var initial_population = {};
    var isInitial = true;
    var running = false;
    var updates;

    const STATE_NAMES = ["Alabama", "Alaska", "Arizona", "Arkansas", "California", "Colorado", "Connecticut", "Delaware", "Florida", "Georgia", "Hawaii", "Idaho",
      "Illinois", "Indiana", "Iowa", "Kansas", "Kentucky", "Louisiana", "Maine", "Maryland", "Massachusetts", "Michigan", "Minnesota", "Mississippi", "Missouri",
      "Montana", "Nebraska", "Nevada", "New Hampshire", "New Jersey", "New Mexico", "New York", "North Carolina", "North Dakota", "Ohio", "Oklahoma", "Oregon",
      "Pennsylvania", "Rhode Island", "South Carolina", "South Dakota", "Tennessee", "Texas", "Utah", "Vermont", "Virginia", "Washington", "West Virginia",
      "Wisconsin", "Wyoming"];

    import { map, mapData, deathMapData } from "/static/js/map.js";
    import { stackedLine, areaData } from "/static/js/stackedLine.js";
    import { Scrubber } from "/static/js/mbostockScrubber.js";
    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

    document.getElementById('map').innerHTML = "<br>waiting for graph.....";
    document.getElementById('stackedLine').innerHTML = "<br>waiting for graph.....";

    async function generateMap() {
      window.mapElem = await map(); // everything below await will not run until this promise is complete

      document.getElementById('map').innerHTML = "";
      document.getElementById('map').append(mapElem);
    }

    async function generateStackedLine() {
      window.stackedLineElem = await stackedLine();

      document.getElementById('stackedLine').innerHTML = "";
      document.getElementById('stackedLine').append(stackedLineElem);
    }

    async function generateGraphs() {
      await generateMap();
      await generateStackedLine();
    }

    await generateGraphs();

    async function fetchData() {
      const response = await fetch(window.location.href, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "data": isInitial ? 'a' : "start"
        }
      });

      console.log(response);
      var data;
      try {
        data = await response.json();
      } catch {
        data = 'end';
      } finally {
        return data;
      }
    }

    async function fetchPageSource() {
      let reset = new XMLHttpRequest();
      reset.open('GET', window.location.href, true);
      reset.send();
    }

    async function updateGraphs() {
      console.log('i worked');
      const data = await fetchData();
      await fetchPageSource();

      if (data != 'end') {
        if (!isInitial) {
          data.forEach(d => {
            const dotsToAdd = createDot(d.state, d.infected);
            for (let i = 0; i < dotsToAdd; i++) {
              let point = mapElem.createPoint(d.state);
              if (point) {
                mapData.push(Object.assign(point, { date: new Date(d.date) }));
              }
            }

            const deaths = (initial_population[d.state] || 0) - d.currPopulation;
            const deathDotsToAdd = createDeathDot(d.state, deaths);
            for (let i = 0; i < deathDotsToAdd; i++) {
              let point = mapElem.createPoint(d.state);
              if (point) {
                deathMapData.push(Object.assign(point, { date: new Date(d.date) }));
              }
            }

            areaData.push(Object.assign({ date: new Date(d.date) },
              { state: d.state },
              { infected: d.infected }
            ));
          });
        } else {
          data.forEach(d => {
            // record the simulations starting population for each state
            if (!(d.state in initial_population)) {
              initial_population[d.state] = d.currPopulation;
            }

            if (d.infected > 0) {
              let point = mapElem.createPoint(d.state);
              if (point) {
                mapData.push(Object.assign(point,
                  { date: new Date(d.date) }
                ));

                if (d.state in state_dots) state_dots[d.state] = state_dots[d.state] + 1;
                else state_dots[d.state] = 1;
              }
            }

            areaData.push(Object.assign({ date: new Date(d.date) },
              { state: d.state },
              { infected: d.infected }
            ));
          });
          isInitial = false;
        };

        mapElem.update(new Date(data[0].date));
        stackedLineElem.update(new Date(data[0].date));

        const totalInfected = data.reduce((sum, d) => sum + d.infected, 0);

        const currentPopulation = data.reduce((sum, d) => sum + d.currPopulation, 0);
        const totalOriginalPopulation = data.reduce((sum, d) => sum + (pops[STATE_NAMES.indexOf(d.state)] || 0), 0);
        const totalDeaths = totalOriginalPopulation - currentPopulation;
        console.log(currentPopulation);
        console.log(totalOriginalPopulation);
        console.log(totalDeaths);

        document.getElementById('stat-state').textContent = "{{ state_name }}";
        document.getElementById('stat-infected').textContent = Math.round(totalInfected).toLocaleString();
        document.getElementById('stat-deaths').textContent = Math.round(totalDeaths).toLocaleString();
        document.getElementById('stat-date').textContent = data[0].date;
      } else {
        clearInterval(updates);
        document.getElementById('util').removeChild(document.getElementById('but1'));
      }
    };

    function createDot(state, infected) {
      const idx = STATE_NAMES.indexOf(state);
      const pop = pops[idx];

      if (!pop || infected <= 0) return 0;

      const current = state_dots[state] ?? 0;
      // 1 dot per 0.1% of population
      const target = current === 0 ? 1 : Math.round((infected / pop) / 0.001);

      if (target <= current) return 0;

      // cap at 10 per tick so fast-growing states don't flood the map at once
      const toAdd = Math.min(target - current, 10, 50 - current);
      if (toAdd <= 0) return 0;
      state_dots[state] = current + toAdd;
      return toAdd;
    };

    function createDeathDot(state, deaths) {
      const pop = initial_population[state];

      if (!pop || deaths <= 0) return 0;

      const current = state_death_dots[state] ?? 0;
      const target = Math.round((deaths / pop) / 0.001);

      if (target <= current) return 0;

      // death dots can never outnumber infection dots for the same state
      const infectionDots = state_dots[state] ?? 0;
      const toAdd = Math.min(target - current, 10, 50 - current, infectionDots - current);
      if (toAdd <= 0) return 0;
      state_death_dots[state] = current + toAdd;
      return toAdd;
    };

    document.getElementById('but1').addEventListener("click", () => {
      if (!running) {
          updateGraphs();
          updates = setInterval(() => {
            console.log('ran');
            updateGraphs()
          }, 500);

          document.getElementById('but1').innerHTML = 'Pause Simulation';
          running = true;
        } else {
          clearInterval(updates);

          document.getElementById('but1').innerHTML = 'Start Simulation';
          running = false;
        }
    });
  </script>
